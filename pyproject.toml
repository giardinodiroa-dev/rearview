[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rearview"
version = "0.1.0"
description = "Rearview — programmable browser automation assistant for sales workflows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44.0",
    "PyQt6>=6.7.0",
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.6",
    "numpy>=1.26.4",
    "pynput>=1.7.6",
    "xvfbwrapper>=0.2.9",
    "typer>=0.12.3",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "thefuzz>=0.22.1",
    "python-levenshtein>=0.25.1",
    "python-dotenv>=1.0.1",
    "watchfiles>=0.21.0",
]

[project.scripts]
rearview = "rearview.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["rearview"]
